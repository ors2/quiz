<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Quiz</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  text-align: center;
  overflow-x: hidden;
  background: url("dth.jpg") no-repeat center center fixed;
  background-size: cover;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: -1;
}

.quiz-title {
  font-size: 42px;
  font-weight: bold;
  background: linear-gradient(90deg, #ef4444, #000000, #ef4444);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: moveColor 3s linear infinite;
}

@keyframes moveColor {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.subtitle {
  color: #ccc;
}

#question {
  font-size: 24px;
  margin: 20px auto;
  padding: 18px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 12px;
  display: inline-block;
}

.doors {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 25px;
}

.door {
  width: 170px;
  height: 230px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.3s;
  font-size: 20px;
}

.door:hover {
  transform: scale(1.07);
}

.correct {
  background: #14532d !important;
  border-color: #22c55e !important;
}

.wrong {
  background: #7f1d1d !important;
  border-color: #ef4444 !important;
}

#timerBox {
  font-size: 26px;
  margin: 110px auto 10px;
  padding: 14px 22px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 12px;
  display: inline-block;
}

#errorScreen {
  display: none;
  padding: 20px;
}

.errorCard {
  background: rgba(0,0,0,0.85);
  border: 1px solid #444;
  border-radius: 12px;
  margin: 15px auto;
  padding: 15px;
  max-width: 650px;
  text-align: right;
}

.errorQ {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.optionsList {
  color: #cbd5e1;
  margin-bottom: 10px;
  line-height: 1.6;
}

.userWrong {
  color: #ef4444;
  font-weight: bold;
}

.correctAns {
  color: #22c55e;
  font-weight: bold;
  margin-top: 5px;
}

button {
  margin-top: 15px;
  padding: 10px;
  background: #111;
  color: white;
  border: 1px solid #444;
  cursor: pointer;
}

.footer {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
  font-weight: bold;
  color: white;
}
</style>
</head>

<body>

<h1 class="quiz-title">Quiz</h1>
<div class="subtitle">إكمال الجمل</div>

<div id="gameScreen">
  <div id="question"></div>
  <div class="doors" id="doors"></div>
  <div id="timerBox">الوقت: 0:00</div>
</div>

<div id="errorScreen">
  <h2>الأخطاء</h2>
  <div id="errorsList"></div>
  <button onclick="restart()">إعادة الاختبار</button>
</div>

<div class="footer">by 0xRaph</div>

<script>

let current = 0;
let score = 0;
let wrong = [];
let locked = false;

let startTime = Date.now();
let timerInterval;

const questions = [
  {
    q: "قام المتهم بتقديم أدلة ......... للقاضي فأعطاه صك ....ليقدمه للجهات المسؤولة.",
    options: ["مقنعة - نزاهة (براءة)", "ضعيفة - إدانة", "مبهمة - رفض", "غير دقيقة - شك"],
    correct: "مقنعة - نزاهة (براءة)"
  },
  {
    q: "قال المذنب كلاماً .......... ، فأصدر له القاضي صك .....",
    options: ["مقنعاً - براءة", "كاذباً - إدانة", "صادقاً - عفو", "ضعيفاً - حكم"],
    correct: "مقنعاً - براءة"
  },
  {
    q: "إذا قررت أن تتحدى ...... إنسان ما ، فتوقع منه ....... و التصدي.",
    options: ["كرامة – المقاومة", "خوف – هروب", "ضعف – استسلام", "كره – انسحاب"],
    correct: "كرامة – المقاومة"
  },
  {
    q: "إذا أردت أن تكشف ……. إنسان ما ، فتوقع منه …… والتصدي.",
    options: ["كذب - المقاومة", "صدق - التعاون", "خداع - هدوء", "حب - قبول"],
    correct: "كذب - المقاومة"
  },
  {
    q: "بين ....... في المدح والإغراق في الذم ..... الحقيقة موتاً.",
    options: ["الإغراق - تموت", "الاعتدال - تعيش", "المدح - تظهر", "الذم - تختفي"],
    correct: "الإغراق - تموت"
  },
  {
    q: "كلما ....... فعل القائد مع قوله ....... على من حوله الاقتداء به.",
    options: ["وافق - سهل", "خالف - صعب", "ابتعد - يمنع", "زاد - يقل"],
    correct: "وافق - سهل"
  },
  {
    q: "من الأفضل أن ...... أقوال المربي مع أفعاله ، لأن ذلك ..... الاقتداء به.",
    options: ["تتوافق - يسهل", "تتخالف - يصعب", "تتناقض - يمنع", "تتباعد - يقل"],
    correct: "تتوافق - يسهل"
  },
  {
    q: "لا تلتفت ل ...... الأمور ؛ حتى لا تلهيك عن .....",
    options: ["توافه - كبارها", "صغائر - عظائم", "أمور - أعمال", "تفاصيل - أهداف"],
    correct: "توافه - كبارها"
  },
  {
    q: "نحن صورة ..... لآبائنا عاشوا من قبلنا وحلوا في .....",
    options: ["جديدة - قلوبنا", "قديمة - أرضنا", "جميلة - حواجز", "مختلفة - أماكننا"],
    correct: "جديدة - قلوبنا"
  },
  {
    q: "القرار ......... قد يجلب .......... مؤقتة.",
    options: ["الصحيح - خيبة", "الخاطئ - نجاح", "السهل - قوة", "المتسرع - راحة"],
    correct: "الصحيح - خيبة"
  },
  {
    q: "يجب ..... الأفكار ودراسة أبعاد ...... قبل اتخاذ القرار.",
    options: ["معالجة - الموقف", "تطوير - الرأي", "مراجعة - التعثر", "تنظيم - الفكرة"],
    correct: "معالجة - الموقف"
  },
  {
    q: "طريق الذهاب من الخطأ إلى الصواب ....... لكنه ........",
    options: ["طويل - ممتع", "قصير - سهل", "صعب - مستحيل", "سريع - ممل"],
    correct: "طويل - ممتع"
  },
  {
    q: "الصمت ......... إذا كان بغرض .........",
    options: ["محمود - الحكمة", "مذموم - العجلة", "مرغوب - الهيبة", "صامت - ضعف"],
    correct: "محمود - الحكمة"
  },
  {
    q: "الإفراط في الجود يتبعه ......... والإفراط في التواضع يتبعه .......",
    options: ["التبذير - التذلل", "الإسراف - القوة", "الكرم - العزة", "البخل - الكبرياء"],
    correct: "التبذير - التذلل"
  },
  {
    q: "إذا زادت مساحة ........... لدي ، زادت معرفتي ب..........",
    options: ["الأمن - الخوف", "العلم - الجهل", "الغنى - الفقر", "الفراغ - العمل"],
    correct: "العلم - الجهل"
  },
  {
    q: "كلما ازددت ...... زادت معرفتي ب.....",
    options: ["معلومات - معرفتي", "علماً - جهلي", "مالاً - فقري", "وقتاً - عملي"],
    correct: "علماً - جهلي"
  },
  {
    q: "كلما ازداد الإنسان .......... اتسعت أمامه مساحة..........",
    options: ["علماً - جهله", "خوفاً - أمانه", "غنى - فقره", "قوة - ضعفه"],
    correct: "علماً - جهله"
  },
  {
    q: "كلما زادت ..... لدى الإنسان، زادت مساحة .......",
    options: ["المعرفة - الجهل", "المال - الفقر", "القوة - الضعف", "الوقت - العمل"],
    correct: "المعرفة - الجهل"
  },
  {
    q: "إن الإنسان كلما زاد ...... زادت رؤيته لمساحة.........",
    options: ["علمه - جهله", "ماله - فقره", "وقته - عمله", "خوفه - أمانه"],
    correct: "علمه - جهله"
  },
  {
    q: "إذا أردت أن تكون ذا مكانة ويذيع ......... ، فيجب أن تقوم بفعل ........... الأمور.",
    options: ["صيتك - معالي", "ذكرك - صغائر", "اسمك - عادية", "شهرتك - بسيطة"],
    correct: "صيتك - معالي"
  },
  {
    q: "إن .... قوة متجددة لبقاء الفرد والمجتمع في .... اليوم والغد.",
    options: ["التفكير - عالم", "العلم - نجاح", "المال - فقر", "الوقت - جهد"],
    correct: "التفكير - عالم"
  },
  {
    q: "إذا كان قلبك ........ فكـل ما يخرج منك ......",
    options: ["صافيًا - مقبولاً", "أسودًا - مرفوض", "ضعيفًا - سيء", "قويًا - قاس"],
    correct: "صافيًا - مقبولاً"
  }
];

function shuffle(a){
  return a.sort(()=>Math.random()-0.5);
}

function startTimer(){
  clearInterval(timerInterval);
  startTime = Date.now();

  timerInterval = setInterval(()=>{
    let sec = Math.floor((Date.now() - startTime) / 1000);
    let min = Math.floor(sec / 60);
    let rem = sec % 60;
    document.getElementById("timerBox").innerText =
      "الوقت: " + min + ":" + (rem < 10 ? "0"+rem : rem);
  },1000);
}

function show(){
  locked = false;
  const q = questions[current];

  document.getElementById("question").innerText = q.q;

  const box = document.getElementById("doors");
  box.innerHTML = "";

  shuffle([...q.options]).forEach(opt=>{
    const d = document.createElement("div");
    d.className = "door";
    d.innerText = opt;
    d.onclick = ()=>check(opt, d);
    box.appendChild(d);
  });
}

function check(opt, door){
  if(locked) return;
  locked = true;

  const q = questions[current];

  if(opt === q.correct){
    score++;
    door.classList.add("correct");
  } else {
    door.classList.add("wrong");
    wrong.push({q: q.q, options: q.options, your: opt, correct: q.correct});
  }

  setTimeout(()=>{
    current++;
    if(current >= questions.length){
      end();
    } else {
      show();
    }
  },500);
}

function end(){
  clearInterval(timerInterval);

  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("errorScreen").style.display = "block";

  const list = document.getElementById("errorsList");
  list.innerHTML = "";

  wrong.forEach(e=>{
    list.innerHTML += `
      <div class="errorCard">
        <div class="errorQ">${e.q}</div>
        <div class="optionsList">
          ${e.options.map(o=>{
            return o === e.your ? `<div class="userWrong">➤ ${o}</div>` : `<div>${o}</div>`;
          }).join("")}
        </div>
        <div class="correctAns">الإجابة الصحيحة: ${e.correct}</div>
      </div>
    `;
  });

  list.innerHTML += `<h3>نتيجتك: ${score} / ${questions.length}</h3>`;
}

function restart(){
  current = 0;
  score = 0;
  wrong = [];

  document.getElementById("errorScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";

  startTimer();
  show();
}

startTimer();
show();

</script>

</body>
</html>
