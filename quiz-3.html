<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Quiz</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  text-align: center;
  overflow-x: hidden;
  background: url("dth.jpg") no-repeat center center fixed;
  background-size: cover;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: -1;
}

.quiz-title {
  font-size: 42px;
  font-weight: bold;
  background: linear-gradient(90deg, #ef4444, #000000, #ef4444);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: moveColor 3s linear infinite;
}

@keyframes moveColor {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.subtitle {
  color: #ccc;
}

#question {
  font-size: 24px;
  margin: 20px auto;
  padding: 18px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 12px;
  display: inline-block;
}

.doors {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 25px;
}

.door {
  width: 170px;
  height: 230px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.3s;
  font-size: 20px; /* كان 16 */
}

.door:hover {
  transform: scale(1.07);
}

.correct {
  background: #14532d !important;
  border-color: #22c55e !important;
}

.wrong {
  background: #7f1d1d !important;
  border-color: #ef4444 !important;
}

/* ⏱️ المؤقت (تم إنزاله أكثر) */
#timerBox {
  font-size: 26px;
  margin: 110px auto 10px;  /* هنا النزول الأساسي */
  padding: 14px 22px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 12px;
  display: inline-block;
}

#errorScreen {
  display: none;
  padding: 20px;
}

.errorCard {
  background: rgba(0,0,0,0.85);
  border: 1px solid #444;
  border-radius: 12px;
  margin: 15px auto;
  padding: 15px;
  max-width: 650px;
  text-align: right;
}

.errorQ {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.optionsList {
  color: #cbd5e1;
  margin-bottom: 10px;
  line-height: 1.6;
}

.userWrong {
  color: #ef4444;
  font-weight: bold;
}

.correctAns {
  color: #22c55e;
  font-weight: bold;
  margin-top: 5px;
}

button {
  margin-top: 15px;
  padding: 10px;
  background: #111;
  color: white;
  border: 1px solid #444;
  cursor: pointer;
}

.footer {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
  font-weight: bold;
  color: white;
}
</style>
</head>

<body>

<h1 class="quiz-title">Quiz</h1>
<div class="subtitle"> إكمال الجمل </div>

<div id="gameScreen">
  <div id="question"></div>
  <div class="doors" id="doors"></div>

  <div id="timerBox">الوقت: 0:00</div>
</div>

<div id="errorScreen">
  <h2>الأخطاء</h2>
  <div id="errorsList"></div>
  <button onclick="restart()">إعادة الاختبار</button>
</div>

<div class="footer">by 0xRaph</div>

<script>

let current = 0;
let score = 0;
let wrong = [];
let locked = false;

let startTime = Date.now();
let timerInterval;

const questions = [
  {
    q: "الصورة التي يرسمها الطفل في مخيلته ما هي إلا أحد أسباب تعليقاتنا عليه.",
    options: ["أسباب", "تعليقات", "مخيلة", "طفل"],
    correct: "أسباب"
  },
  {
    q: "الأمل وقود الحياة وما الحياة إلا آمال وأمان نسعي أمامها سعي الصياد خلف الفريسة.",
    options: ["الأمل", "الحياة", "الفريسة", "أمامها"],
    correct: "أمامها"
  },
  {
    q: "لا تخشى النجاح في سعيك نحو التحديات العظيمة.",
    options: ["النجاح", "السعي", "التحديات", "العظيمة"],
    correct: "النجاح"
  }
];

function shuffle(a){
  return a.sort(()=>Math.random()-0.5);
}

function startTimer(){
  clearInterval(timerInterval);
  startTime = Date.now();

  timerInterval = setInterval(()=>{
    let sec = Math.floor((Date.now() - startTime) / 1000);

    let min = Math.floor(sec / 60);
    let remSec = sec % 60;

    let timeText = min + ":" + (remSec < 10 ? "0" + remSec : remSec);

    document.getElementById("timerBox").innerText = "الوقت: " + timeText;
  }, 1000);
}

function show(){
  locked = false;

  const q = questions[current];
  document.getElementById("question").innerText = q.q;

  const box = document.getElementById("doors");
  box.innerHTML = "";

  shuffle([...q.options]).forEach(opt=>{
    const d = document.createElement("div");
    d.className = "door";
    d.innerText = opt;
    d.onclick = ()=>check(opt, d);
    box.appendChild(d);
  });
}

function check(opt, door){
  if(locked) return;
  locked = true;

  const q = questions[current];

  if(opt === q.correct){
    score++;
    door.classList.add("correct");
  } else {
    door.classList.add("wrong");
    wrong.push({
      q: q.q,
      options: q.options,
      your: opt,
      correct: q.correct
    });
  }

  setTimeout(()=>{
    current++;
    if(current >= questions.length){
      end();
    } else {
      show();
    }
  },500);
}

function end(){
  clearInterval(timerInterval);

  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("errorScreen").style.display = "block";

  const list = document.getElementById("errorsList");
  list.innerHTML = "";

  wrong.forEach(e=>{
    list.innerHTML += `
      <div class="errorCard">
        <div class="errorQ">${e.q}</div>
        <div class="optionsList">
          ${e.options.map(o=>{
            if(o === e.your){
              return `<div class="userWrong">➤ ${o}</div>`;
            }
            return `<div>${o}</div>`;
          }).join("")}
        </div>
        <div class="correctAns">الإجابة الصحيحة: ${e.correct}</div>
      </div>
    `;
  });

  list.innerHTML += `<h3>نتيجتك: ${score} / ${questions.length}</h3>`;
}

function restart(){
  current = 0;
  score = 0;
  wrong = [];

  document.getElementById("errorScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";

  startTimer();
  show();
}

startTimer();
show();

</script>

</body>
</html>
