<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Quiz</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  text-align: center;
  overflow-x: hidden;

  background: url("dth.jpg") no-repeat center center fixed;
  background-size: cover;
  background-color: #111; /* fallback */
}

/* overlay آمن */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 0;
}

#gameScreen, #errorScreen, h1, .subtitle {
  position: relative;
  z-index: 2;
}

.quiz-title {
  font-size: 42px;
  font-weight: bold;
  background: linear-gradient(90deg, #ef4444, #000000, #ef4444);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: moveColor 3s linear infinite;
}

@keyframes moveColor {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.subtitle { color:#ccc; }

#question {
  font-size: 24px;
  margin: 20px auto;
  padding: 18px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 12px;
  display: inline-block;
  animation: fade 0.2s ease;
}

@keyframes fade {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}

.doors {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.door {
  width: 170px;
  height: 230px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
  font-size: 18px;
  user-select: none;
}

.door:active { transform: scale(0.95); }

.correct {
  background: #14532d !important;
  border-color: #22c55e !important;
}

.wrong {
  background: #7f1d1d !important;
  border-color: #ef4444 !important;
}

#errorScreen { display:none; padding:20px; }

.footer {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 20px;
}
</style>
</head>

<body>

<h1 class="quiz-title">Quiz</h1>
<div class="subtitle">تناظر لفظي</div>

<div id="gameScreen">
  <div id="question"></div>
  <div class="doors" id="doors"></div>
</div>

<div id="errorScreen">
  <h2>الأخطاء</h2>
  <div id="errorsList"></div>
  <button onclick="restart()">إعادة</button>
</div>

<div class="footer">by 0xRaph</div>

<script>

let current=0;
let score=0;
let wrong=[];
let locked=false;

/* 🔥 كل أسئلتك (بدون حذف) */
const questions = [
  {q:"شمس : غروب", options:["كوكب : سقوط","قمر : خسوف","شهاب : ظهور","نجم : أفول"], correct:"نجم : أفول"},
  {q:"كره : استساغ", options:["حقد : تسامح","محبة : استحسان","رفض : رمي","ظلم : قساوة"], correct:"حقد : تسامح"},
  {q:"كتاب : صفحة", options:["مجلة : مقال","غرفة : بيت"], correct:"مجلة : مقال"},
  {q:"غش : عقاب", options:["سرعة : حادث","حليب : لبن"], correct:"سرعة : حادث"},
  {q:"ولوج : دخول", options:["أسد : ليث","معركة : ساحة","ثوب : لباس","ليل : مساء"], correct:"أسد : ليث"},
  {q:"قسوة : حجارة", options:["قمة : علو","ذهن : ذكاء","غيوم : تفاؤل","تدرج : سلم"], correct:"تدرج : سلم"},
  {q:"مؤلف : كتاب", options:["كاتب : جريدة","منشد : قصيدة","قبطان : سفينة","مدرب : دورة"], correct:"قبطان : سفينة"}
];

function shuffle(a){
  return a.sort(()=>Math.random()-0.5);
}

function show(){
  locked=false;

  const q = questions[current];
  if(!q){ end(); return; }

  document.getElementById("question").innerText = q.q;

  const box = document.getElementById("doors");
  box.innerHTML = "";

  shuffle([...q.options]).forEach(opt=>{
    const d=document.createElement("div");
    d.className="door";
    d.innerText=opt;

    d.onclick=()=>check(opt,d);

    box.appendChild(d);
  });
}

function check(opt, door){
  if(locked) return;
  locked=true;

  const q=questions[current];

  if(opt===q.correct){
    score++;
    door.classList.add("correct");
  } else {
    door.classList.add("wrong");
    wrong.push({q:q.q, options:q.options, your:opt, correct:q.correct});
  }

  setTimeout(()=>{
    current++;
    show();
  },400);
}

function end(){
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("errorScreen").style.display="block";

  const list=document.getElementById("errorsList");
  list.innerHTML="";

  wrong.forEach(e=>{
    list.innerHTML+=`
      <div>
        <p>${e.q}</p>
        <p>✔ ${e.correct}</p>
      </div>
    `;
  });

  list.innerHTML+=`<h3>نتيجتك: ${score}/${questions.length}</h3>`;
}

function restart(){
  current=0;
  score=0;
  wrong=[];

  document.getElementById("errorScreen").style.display="none";
  document.getElementById("gameScreen").style.display="block";

  show();
}

show();

</script>

</body>
</html>
