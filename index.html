<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Quiz</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: Arial;
  color: white;
  text-align: center;
  overflow-x: hidden;
  position: relative;
}

/* الخلفية */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("dth.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: -2;
  pointer-events: none;
}

/* التعتيم */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: -1;
  pointer-events: none;
}

/* العنوان */
.quiz-title {
  font-size: 42px;
  font-weight: bold;
  background: linear-gradient(90deg, #ef4444, #000000, #ef4444);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: moveColor 3s linear infinite;
}

@keyframes moveColor {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.subtitle {
  color: #ccc;
}

/* سؤال + انيميشن انتقال */
#question {
  font-size: 24px;
  margin: 20px auto;
  padding: 18px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 12px;
  display: inline-block;

  opacity: 1;
  transform: translateY(0);
  transition: 0.3s ease;
}

#question.fade {
  opacity: 0;
  transform: translateY(-20px);
}

/* الأبواب */
.doors {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 25px;
}

.door {
  width: 170px;
  height: 230px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.3s;
  font-size: 16px;
}

.door:hover {
  transform: scale(1.07);
}

/* صح وخطأ */
.correct {
  background: #14532d !important;
  border-color: #22c55e !important;
}

.wrong {
  background: #7f1d1d !important;
  border-color: #ef4444 !important;
  animation: shake 0.3s;
}

/* اهتزاز */
@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}

/* موبايل UI */
@media (max-width: 768px) {
  .doors {
    flex-direction: column;
    align-items: center;
  }

  .door {
    width: 90%;
    height: 70px;
    font-size: 18px;
  }

  #question {
    font-size: 20px;
    margin: 15px;
  }

  .quiz-title {
    font-size: 32px;
  }
}

/* الأخطاء */
#errorScreen {
  display: none;
  padding: 20px;
  position: relative;
  z-index: 2;
}

.errorCard {
  background: rgba(0,0,0,0.85);
  border: 1px solid #444;
  border-radius: 12px;
  margin: 15px auto;
  padding: 15px;
  max-width: 650px;
  text-align: right;
}

.errorQ {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.optionsList {
  color: #cbd5e1;
  margin-bottom: 10px;
  line-height: 1.6;
}

.userWrong {
  color: #ef4444;
  font-weight: bold;
}

.correctAns {
  color: #22c55e;
  font-weight: bold;
  margin-top: 5px;
}

/* زر */
button {
  margin-top: 15px;
  padding: 10px;
  background: #111;
  color: white;
  border: 1px solid #444;
  cursor: pointer;
}

/* الفوتر */
.footer {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
  font-weight: bold;
  color: white;
}
</style>
</head>

<body>

<h1 class="quiz-title">Quiz</h1>
<div class="subtitle">تناظر لفظي</div>

<div id="gameScreen">
  <div id="question"></div>
  <div class="doors" id="doors"></div>
</div>

<div id="errorScreen">
  <h2>الأخطاء</h2>
  <div id="errorsList"></div>
  <button onclick="restart()">إعادة الاختبار</button>
</div>

<div class="footer">by 0xRaph</div>

<script>

const questions = [
  {q:"شمس : غروب", options:["كوكب : سقوط","قمر : خسوف","شهاب : ظهور","نجم : أفول"], correct:"نجم : أفول"},
  {q:"كره : استساغ", options:["حقد : تسامح","محبة : استحسان","رفض : رمي","ظلم : قساوة"], correct:"حقد : تسامح"},
  {q:"كتاب : صفحة", options:["مجلة : مقال","غرفة : بيت"], correct:"مجلة : مقال"}
];

let current = 0;
let score = 0;
let wrong = [];
let locked = false;

function animateQuestionChange(){
  const q = document.getElementById("question");
  q.classList.add("fade");

  setTimeout(()=>{
    q.classList.remove("fade");
  }, 200);
}

/* اهتزاز */
function vibrate(){
  if (navigator.vibrate) {
    navigator.vibrate(200);
  }
}

function shuffle(a){
  return a.sort(()=>Math.random()-0.5);
}

function show(){
  locked = false;

  animateQuestionChange();

  const q = questions[current];
  document.getElementById("question").innerText = q.q;

  const box = document.getElementById("doors");
  box.innerHTML = "";

  shuffle([...q.options]).forEach(opt=>{
    const d = document.createElement("div");
    d.className = "door";
    d.innerText = opt;
    d.onclick = ()=>check(opt, d);
    box.appendChild(d);
  });
}

function check(opt, door){
  if(locked) return;
  locked = true;

  const q = questions[current];

  if(opt === q.correct){
    score++;
    door.classList.add("correct");
  } else {
    door.classList.add("wrong");
    vibrate();

    wrong.push({
      q:q.q,
      options:q.options,
      your:opt,
      correct:q.correct
    });
  }

  setTimeout(()=>{
    current++;
    if(current >= questions.length){
      end();
    } else {
      show();
    }
  },500);
}

function end(){
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("errorScreen").style.display="block";

  const list = document.getElementById("errorsList");
  list.innerHTML="";

  wrong.forEach(e=>{
    list.innerHTML += `
      <div class="errorCard">
        <div class="errorQ">${e.q}</div>
        <div class="optionsList">
          ${e.options.map(o=> o===e.your?`<div class="userWrong">➤ ${o}</div>`:`<div>${o}</div>`).join("")}
        </div>
        <div class="correctAns">الإجابة الصحيحة: ${e.correct}</div>
      </div>
    `;
  });

  list.innerHTML += `<h3>نتيجتك: ${score} / ${questions.length}</h3>`;
}

function restart(){
  current=0;
  score=0;
  wrong=[];

  document.getElementById("errorScreen").style.display="none";
  document.getElementById("gameScreen").style.display="block";

  show();
}

show();

</script>

</body>
</html>
