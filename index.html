<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Quiz</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  text-align: center;
  overflow-x: hidden;
  background: url("dth.jpg") no-repeat center center fixed;
  background-size: cover;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: -1;
}

/* ⭐ عنوان Quiz المتحرك */
.quiz-title {
  font-size: 42px;
  font-weight: bold;

  background: linear-gradient(90deg, #ef4444, #000000, #ef4444);
  background-size: 200% 200%;

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  animation: moveColor 3s linear infinite;
}

@keyframes moveColor {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.subtitle {
  color: #ccc;
}

/* السؤال */
#question {
  font-size: 24px;
  margin: 20px auto;
  padding: 18px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 12px;
  display: inline-block;
}

/* الأبواب */
.doors {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 25px;
}

.door {
  width: 170px;
  height: 230px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 10px;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  transition: 0.3s;
  font-size: 16px;
}

.door:hover {
  transform: scale(1.07);
}

.correct {
  background: #14532d !important;
  border-color: #22c55e !important;
}

.wrong {
  background: #7f1d1d !important;
  border-color: #ef4444 !important;
}

/* ⏱️ المؤقت */
#timerBox {
  font-size: 26px;
  margin: 110px auto 10px;
  padding: 14px 22px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 12px;
  display: inline-block;
}

#errorScreen {
  display: none;
  padding: 20px;
}

.errorCard {
  background: rgba(0,0,0,0.85);
  border: 1px solid #444;
  border-radius: 12px;
  margin: 15px auto;
  padding: 15px;
  max-width: 650px;
  text-align: right;
}

.errorQ {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.optionsList {
  color: #cbd5e1;
  margin-bottom: 10px;
  line-height: 1.6;
}

.userWrong {
  color: #ef4444;
  font-weight: bold;
}

.correctAns {
  color: #22c55e;
  font-weight: bold;
  margin-top: 5px;
}

button {
  margin-top: 15px;
  padding: 10px;
  background: #111;
  color: white;
  border: 1px solid #444;
  cursor: pointer;
}

.footer {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
  font-weight: bold;
  color: white;
}
</style>
</head>

<body>

<h1 class="quiz-title">Quiz</h1>
<div class="subtitle">تناظر لفظي</div>

<div id="gameScreen">
  <div id="question"></div>
  <div class="doors" id="doors"></div>

  <div id="timerBox">الوقت: 0:00</div>
</div>

<div id="errorScreen">
  <h2>الأخطاء</h2>
  <div id="errorsList"></div>
  <button onclick="restart()">إعادة الاختبار</button>
</div>

<div class="footer">by 0xRaph</div>

<script>

const questions = [
  {q:"شمس : غروب", options:["كوكب : سقوط","قمر : خسوف","شهاب : ظهور","نجم : أفول"], correct:"نجم : أفول"},
  {q:"كره : استساغ", options:["حقد : تسامح","محبة : استحسان","رفض : رمي","ظلم : قساوة"], correct:"حقد : تسامح"},
  {q:"كتاب : صفحة", options:["مجلة : مقال","غرفة : بيت"], correct:"مجلة : مقال"},
  {q:"غش : عقاب", options:["سرعة : حادث","حليب : لبن"], correct:"سرعة : حادث"},
  {q:"ولوج : دخول", options:["أسد : ليث","معركة : ساحة","ثوب : لباس","ليل : مساء"], correct:"أسد : ليث"},
  {q:"قسوة : حجارة", options:["قمة : علو","ذهن : ذكاء","غيوم : تفاؤل","تدرج : سلم"], correct:"تدرج : سلم"},
  {q:"مؤلف : كتاب", options:["كاتب : جريدة","منشد : قصيدة","قبطان : سفينة","مدرب : دورة"], correct:"قبطان : سفينة"},
  {q:"سيل : مطر", options:["ريح : عاصفة","جبل : حصى","برد : ثلج","غيوم : سحاب"], correct:"غيوم : سحاب"},
  {q:"رياح : هواء", options:["طوفان : ماء","كهرباء : صعق","أرض : بركان","سحاب : ثلج"], correct:"طوفان : ماء"},
  {q:"القفاز : الحماية", options:["المجهر : التكبير","تبريد : مكيف","شتاء : معطف","سور : حائط"], correct:"المجهر : التكبير"},
  {q:"حلوى : سكر", options:["سماء : نجوم","كتاب : ورق"], correct:"كتاب : ورق"},
  {q:"سيل : جارف", options:["رجل : حازم","كلام : هادر","طائر : تغريد","كتاب : واسع"], correct:"رجل : حازم"},
  {q:"خطبة : نثر", options:["عنب : فواكه","بلاغة : نحو","ورقيات : بقدونس","منازل : مساكن"], correct:"بلاغة : نحو"},
  {q:"كلام : ثرثرة", options:["طل : وابل","كرم : جود","فوز : جائزة","طوبة : جفاف"], correct:"كرم : جود"},
  {q:"لحن : خطأ", options:["وابل : طل","سعادة : فرح","إحساس : شعور"], correct:"سعادة : فرح"},
  {q:"مشجعين : ملعب", options:["رسالة : ظرف","طلاب : فسحة","قطار : سكة","عصفور : جو"], correct:"قطار : سكة"},
  {q:"نقود : مصرف", options:["معهد : جامعة","شاي : سكر","عصفور : قفص","زبيب : عنب"], correct:"عصفور : قفص"},
  {q:"أبحاث : تطور", options:["عمل : شهادة","تجارة : استثمار","شيب : ضعف","فوز : جهد"], correct:"شيب : ضعف"},
  {q:"السماء : الكواكب", options:["النمور : الحيوانات","المرأة : الذهب","المكتبة : الكتب","الإنسان : الماء"], correct:"المكتبة : الكتب"},
  {q:"كمثرى : رمان", options:["جبنة : لبنة","كرز : لوز","حديد : خشب","مال : نفط"], correct:"جبنة : لبنة"},
  {q:"وضوء : صلاة", options:["تجربة : حكم","ثقافة : إطلاع"], correct:"تجربة : حكم"}
];

let current = 0;
let score = 0;
let wrong = [];
let locked = false;

let startTime = Date.now();
let timerInterval;

function startTimer(){
  clearInterval(timerInterval);
  startTime = Date.now();

  timerInterval = setInterval(()=>{
    let sec = Math.floor((Date.now() - startTime)/1000);
    let min = Math.floor(sec/60);
    let r = sec%60;

    document.getElementById("timerBox").innerText =
      "الوقت: " + min + ":" + (r<10?"0"+r:r);
  },1000);
}

function shuffle(a){
  return a.sort(()=>Math.random()-0.5);
}

function show(){
  locked = false;

  const q = questions[current];
  document.getElementById("question").innerText = q.q;

  const box = document.getElementById("doors");
  box.innerHTML = "";

  shuffle([...q.options]).forEach(opt=>{
    const d = document.createElement("div");
    d.className = "door";
    d.innerText = opt;
    d.onclick = ()=>check(opt,d);
    box.appendChild(d);
  });
}

function check(opt, door){
  if(locked) return;
  locked = true;

  const q = questions[current];

  if(opt === q.correct){
    score++;
    door.classList.add("correct");
  } else {
    door.classList.add("wrong");
    wrong.push({q:q.q, options:q.options, your:opt, correct:q.correct});
  }

  setTimeout(()=>{
    current++;
    if(current >= questions.length){
      end();
    } else {
      show();
    }
  },500);
}

function end(){
  clearInterval(timerInterval);

  document.getElementById("gameScreen").style.display="none";
  document.getElementById("errorScreen").style.display="block";

  const list = document.getElementById("errorsList");
  list.innerHTML="";

  wrong.forEach(e=>{
    list.innerHTML += `
      <div class="errorCard">
        <div class="errorQ">${e.q}</div>
        <div class="optionsList">
          ${e.options.map(o=> o===e.your?`<div class="userWrong">➤ ${o}</div>`:`<div>${o}</div>`).join("")}
        </div>
        <div class="correctAns">الإجابة الصحيحة: ${e.correct}</div>
      </div>
    `;
  });

  list.innerHTML += `<h3>نتيجتك: ${score} / ${questions.length}</h3>`;
}

function restart(){
  current=0;
  score=0;
  wrong=[];

  document.getElementById("errorScreen").style.display="none";
  document.getElementById("gameScreen").style.display="block";

  startTimer();
  show();
}

startTimer();
show();

</script>

</body>
</html>
