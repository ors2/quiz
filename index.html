<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Quiz</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  text-align: center;
  overflow-x: hidden;
 background: #111;
  background-size: cover;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: -1;
}

/* ⭐ عنوان */
.quiz-title {
  font-size: 42px;
  font-weight: bold;
  background: linear-gradient(90deg, #ef4444, #000000, #ef4444);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: moveColor 3s linear infinite;
}

@keyframes moveColor {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.subtitle { color:#ccc; }

/* ⭐ سؤال مع انيميشن */
#question {
  font-size: 24px;
  margin: 20px auto;
  padding: 18px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 12px;
  display: inline-block;

  animation: fade 0.3s ease;
}

@keyframes fade {
  from {opacity:0; transform: translateY(10px);}
  to {opacity:1; transform: translateY(0);}
}

/* ⭐ أبواب (موبايل أفضل) */
.doors {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin-top: 25px;
}

.door {
  width: 160px;
  height: 200px;
  background: rgba(10,10,10,0.95);
  border: 2px solid #3b0a0a;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.25s;
  font-size: 18px;

  user-select: none;
}

.door:active {
  transform: scale(0.95);
}

.door:hover {
  transform: scale(1.05);
}

.correct {
  background: #14532d !important;
  border-color: #22c55e !important;
}

.wrong {
  background: #7f1d1d !important;
  border-color: #ef4444 !important;
  animation: shake 0.3s;
}

/* ⭐ اهتزاز عند الخطأ */
@keyframes shake {
  0% {transform: translateX(0);}
  25% {transform: translateX(-5px);}
  50% {transform: translateX(5px);}
  75% {transform: translateX(-5px);}
  100% {transform: translateX(0);}
}

/* موبايل UI */
@media (max-width: 600px){
  .door{
    width: 90%;
    height: 80px;
    font-size: 16px;
  }
}

/* الباقي نفس تصميمك */
#errorScreen { display:none; padding:20px; }

.errorCard {
  background: rgba(0,0,0,0.85);
  border: 1px solid #444;
  border-radius: 12px;
  margin: 15px auto;
  padding: 15px;
  max-width: 650px;
  text-align: right;
}

.userWrong { color:#ef4444; font-weight:bold; }
.correctAns { color:#22c55e; font-weight:bold; }

.footer {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
}
</style>
</head>

<body>

<h1 class="quiz-title">Quiz</h1>
<div class="subtitle">تناظر لفظي</div>

<div id="gameScreen">
  <div id="question"></div>
  <div class="doors" id="doors"></div>
</div>

<div id="errorScreen">
  <h2>الأخطاء</h2>
  <div id="errorsList"></div>
  <button onclick="restart()">إعادة</button>
</div>

<div class="footer">by 0xRaph</div>

<script>

const questions = [/* نفس أسئلتك بدون تغيير */];

let current=0, score=0, wrong=[], locked=false;

function shuffle(a){
  return a.sort(()=>Math.random()-0.5);
}

/* ⭐ إصلاح الانتقال */
function show(){
  locked=false;

  const q = questions[current];

  const qBox = document.getElementById("question");
  const dBox = document.getElementById("doors");

  qBox.style.opacity = 0;
  dBox.style.opacity = 0;

  setTimeout(()=>{
    qBox.innerText = q.q;
    qBox.style.opacity = 1;

    dBox.innerHTML="";

    shuffle([...q.options]).forEach(opt=>{
      const d=document.createElement("div");
      d.className="door";
      d.innerText=opt;

      d.onclick=()=>check(opt,d);

      dBox.appendChild(d);
    });

    dBox.style.opacity=1;
  },150);
}

function check(opt, door){
  if(locked) return;
  locked=true;

  const q=questions[current];

  if(opt===q.correct){
    score++;
    door.classList.add("correct");
  } else {
    door.classList.add("wrong");

    /* اهتزاز الشاشة */
    document.body.style.animation="shake 0.3s";
    setTimeout(()=>document.body.style.animation="",300);

    wrong.push({q:q.q, options:q.options, your:opt, correct:q.correct});
  }

  setTimeout(()=>{
    current++;
    if(current>=questions.length) end();
    else show();
  },400);
}

function end(){
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("errorScreen").style.display="block";

  const list=document.getElementById("errorsList");
  list.innerHTML="";

  wrong.forEach(e=>{
    list.innerHTML+=`
      <div class="errorCard">
        <div>${e.q}</div>
        <div>${e.options.map(o=>o===e.your?`<div class="userWrong">${o}</div>`:`<div>${o}</div>`).join("")}</div>
        <div class="correctAns">✔ ${e.correct}</div>
      </div>
    `;
  });

  list.innerHTML+=`<h3>نتيجتك: ${score}/${questions.length}</h3>`;
}

function restart(){
  current=0; score=0; wrong=[];

  document.getElementById("errorScreen").style.display="none";
  document.getElementById("gameScreen").style.display="block";

  show();
}

show();

</script>

</body>
</html>
